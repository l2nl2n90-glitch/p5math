<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>平面圖形大搜查｜一年級數學專題研習工作紙（單頁）</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #e8edf3;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Heiti TC", sans-serif;
    color: #2b3440;
  }
  .page {
    width: 210mm; height: 297mm;
    background: #fff;
    margin: 0 auto;
    padding: 9mm 11mm 7mm;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 14px rgba(0,0,0,.12);
  }
  @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; } }

  /* ---------- 頁首 ---------- */
  .head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2.5px solid #2f7fb8; padding-bottom: 2mm; }
  h1 { font-size: 19pt; margin: 0; letter-spacing: 2px; color: #1c4a6e; line-height: 1.15; }
  .kicker2 { font-size: 8pt; color: #6b7c8f; letter-spacing: 2px; margin-top: 1mm; }
  .fields { font-size: 9pt; color: #44556a; line-height: 1.85; text-align: right; }
  .fields .fl { display: inline-block; width: 28mm; border-bottom: 1px solid #9fb0c2; }

  /* ---------- 小標題 ---------- */
  .bar { display: flex; align-items: center; gap: 2mm; margin: 2mm 0 1.4mm; }
  .bar::before { content: ""; width: 1.3mm; height: 4.6mm; border-radius: 1mm; background: #2f7fb8; }
  .bar h2 { font-size: 11pt; margin: 0; color: #1c4a6e; letter-spacing: .5px; font-weight: 700; }
  .bar .hint { font-size: 7.8pt; color: #8595a6; margin-left: auto; }

  /* ---------- 場景 ---------- */
  .scene { border: 1.2px solid #d3dde8; border-radius: 2.2mm; padding: 1.2mm; background: #fff; }
  .scene svg { display: block; }

  /* ---------- 統計柱 ---------- */
  .chart { display: flex; gap: 1.6mm; border: 1.2px solid #d3dde8; border-radius: 2.2mm; padding: 2mm 1.5mm 1.5mm; background: #fbfdff; }
  .ccol { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .ccol .top { display: flex; align-items: center; gap: 1.4mm; height: 9mm; }
  .ccol .num { width: 7mm; height: 7mm; border: 1.2px dashed #b6c6d6; border-radius: 1mm; background: #fff; }
  .ccol .nm { font-size: 8.5pt; color: #44556a; margin-top: .5mm; }
  .cells-v { display: flex; flex-direction: column-reverse; gap: 1mm; margin-top: .8mm; }
  .cell-v { width: 17mm; height: 5mm; border: 1px solid #b6c6d6; border-radius: 1mm; background: #fff; }

  /* ---------- 發現 ---------- */
  .find { display: flex; align-items: center; gap: 3mm; margin-top: 1.6mm; font-size: 9.5pt; color: #44556a; }
  .find .bl { display: inline-block; width: 14mm; border-bottom: 1px solid #6b7c8f; }
  .self { display: flex; align-items: center; gap: 2mm; margin-left: auto; font-size: 8pt; color: #8595a6; }
  .face { width: 4.6mm; height: 4.6mm; border-radius: 50%; background: #fff; border: 1.3px solid #b6c6d6; }

  /* ---------- 連線 ---------- */
  .match { display: flex; gap: 1.5mm; }
  .mcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .8mm; }
  .mcol .cap { font-size: 8pt; color: #44556a; height: 3.6mm; }
  .gapzone { height: 12mm; position: relative; }
  .gapzone .lbl { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 7.5pt; color: #b3c0cd; letter-spacing: 1px; }

  /* ---------- 創作 ---------- */
  .draw {
    height: 31mm; border: 1.2px solid #d3dde8; border-radius: 2.2mm; position: relative;
    background-image: linear-gradient(#eef3f8 1px, transparent 1px), linear-gradient(90deg, #eef3f8 1px, transparent 1px);
    background-size: 6.5mm 6.5mm; background-color: #fff;
  }
  .draw .tip { position: absolute; right: 2.5mm; bottom: 1mm; font-size: 7.8pt; color: #9fb0c2; letter-spacing: 1px; }
  .mcount { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.8mm; margin-top: 1.4mm; }
  .mc {
    display: flex; align-items: center; gap: 1.4mm; justify-content: center;
    border: 1.2px dashed #b6c6d6; border-radius: 1.8mm; padding: .8mm .6mm; background: #fbfdff;
  }
  .mc .bl { display: inline-block; width: 7mm; border-bottom: 1px solid #6b7c8f; }

  .foot { position: absolute; left: 11mm; right: 11mm; bottom: 3.5mm; display: flex; justify-content: space-between; font-size: 7pt; color: #b3c0cd; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="page">

  <!-- 頁首 -->
  <div class="head">
    <div>
      <h1>平面圖形大搜查</h1>
      <div class="kicker2">一年級數學 · 專題研習工作紙</div>
    </div>
    <div class="fields">
      班別：<span class="fl" style="width:22mm"></span>　姓名：<span class="fl" style="width:26mm"></span><br>
      日期：<span class="fl" style="width:22mm"></span>　得分：<span class="fl" style="width:26mm"></span>
    </div>
  </div>

  <!-- 搜查 -->
  <div class="bar"><h2>圖形大搜查</h2><span class="hint">只數有黑邊的圖形；數完把數量寫在小方格，再塗統計柱</span></div>
  <div class="scene">
    <svg viewBox="0 22 500 284" width="100%">
      <rect x="0" y="0" width="500" height="330" fill="#eef7fc" stroke="none"/>
      <path d="M0,248 Q120,226 250,248 T500,242 L500,330 L0,330 Z" fill="#eaf6ea" stroke="none"/>

      <!-- 太陽 -->
      <circle cx="440" cy="48" r="26" fill="#fff3d6" stroke="#333" stroke-width="3"/>
      <!-- 氣球 ×2 -->
      <line x1="66" y1="74" x2="72" y2="104" stroke="#9aa9b8" stroke-width="1.6"/>
      <line x1="96" y1="52" x2="88" y2="96" stroke="#9aa9b8" stroke-width="1.6"/>
      <circle cx="66" cy="58" r="16" fill="#fde2e2" stroke="#333" stroke-width="3"/>
      <circle cx="96" cy="40" r="12" fill="#e8e4fb" stroke="#333" stroke-width="3"/>

      <!-- 房子 -->
      <polygon points="197,96 132,148 262,148" fill="#f7dada" stroke="#333" stroke-width="3"/>
      <polygon points="197,117 208.3,123.5 208.3,136.5 197,143 185.7,136.5 185.7,123.5" fill="#fdeedd" stroke="#333" stroke-width="3"/>
      <rect x="147" y="148" width="100" height="100" fill="#ffffff" stroke="#333" stroke-width="3"/>
      <rect x="220" y="165" width="26" height="26" fill="#d9ecf7" stroke="#333" stroke-width="3"/>
      <rect x="163" y="198" width="34" height="50" fill="#e3eef7" stroke="#333" stroke-width="3"/>
      <line x1="197" y1="64" x2="197" y2="98" stroke="#9aa9b8" stroke-width="1.8"/>
      <polygon points="197,64 229,76 197,88" fill="#ffe0b3" stroke="#333" stroke-width="3"/>

      <!-- 樹 ×2 -->
      <polygon points="320,132 356,188 284,188" fill="#d9efd9" stroke="#333" stroke-width="3"/>
      <rect x="312" y="188" width="16" height="60" fill="#f3e3cf" stroke="#333" stroke-width="3"/>
      <polygon points="415,150 447,200 383,200" fill="#d9efd9" stroke="#333" stroke-width="3"/>
      <rect x="407" y="200" width="16" height="48" fill="#f3e3cf" stroke="#333" stroke-width="3"/>

      <!-- 積木、五邊形、六邊形、球 -->
      <rect x="258" y="220" width="28" height="28" fill="#fff1c9" stroke="#333" stroke-width="3"/>
      <polygon points="270,272 287.1,284.4 280.6,304.6 259.4,304.6 252.9,284.4" fill="#f0e6fb" stroke="#333" stroke-width="3"/>
      <polygon points="140,265 160.9,280.2 152.9,304.8 127.1,304.8 119.1,280.2" fill="#f0e6fb" stroke="#333" stroke-width="3"/>
      <polygon points="390,282 380,299.3 360,299.3 350,282 360,264.7 380,264.7" fill="#fdeedd" stroke="#333" stroke-width="3"/>
      <circle cx="46" cy="270" r="15" fill="#ffe9cc" stroke="#333" stroke-width="3"/>
    </svg>
  </div>

  <!-- 統計 -->
  <div class="bar"><h2>圖形統計</h2><span class="hint">一格代表 1 個，由下往上塗</span></div>
  <div class="chart">
    <div class="ccol">
      <div class="top"><svg width="20" height="20" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#ffe6e6" stroke="#333" stroke-width="2.8"/></svg><span class="num"></span></div>
      <div class="nm">圓形</div>
      <div class="cells-v"><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div></div>
    </div>
    <div class="ccol">
      <div class="top"><svg width="20" height="20" viewBox="0 0 40 40"><polygon points="20,5 36,32 4,32" fill="#fff3d6" stroke="#333" stroke-width="2.8"/></svg><span class="num"></span></div>
      <div class="nm">三角形</div>
      <div class="cells-v"><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div></div>
    </div>
    <div class="ccol">
      <div class="top"><svg width="20" height="20" viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" fill="#e2f0fb" stroke="#333" stroke-width="2.8"/></svg><span class="num"></span></div>
      <div class="nm">正方形</div>
      <div class="cells-v"><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div></div>
    </div>
    <div class="ccol">
      <div class="top"><svg width="20" height="20" viewBox="0 0 40 40"><rect x="4" y="13" width="32" height="14" fill="#e6f7e6" stroke="#333" stroke-width="2.8"/></svg><span class="num"></span></div>
      <div class="nm">長方形</div>
      <div class="cells-v"><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div></div>
    </div>
    <div class="ccol">
      <div class="top"><svg width="20" height="20" viewBox="0 0 40 40"><polygon points="20,4 35,15 29,32 11,32 5,15" fill="#f0e6fb" stroke="#333" stroke-width="2.8"/></svg><span class="num"></span></div>
      <div class="nm">五邊形</div>
      <div class="cells-v"><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div></div>
    </div>
    <div class="ccol">
      <div class="top"><svg width="20" height="20" viewBox="0 0 40 40"><polygon points="36,20 28,34 12,34 4,20 12,6 28,6" fill="#fdeedd" stroke="#333" stroke-width="2.8"/></svg><span class="num"></span></div>
      <div class="nm">六邊形</div>
      <div class="cells-v"><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div><div class="cell-v"></div></div>
    </div>
  </div>

  <!-- 發現 -->
  <div class="find">
    <span>我發現：<span class="bl"></span> 形最多，<span class="bl"></span> 形最少。</span>
    <span class="self"><span>今天我做得：</span><span class="face"></span><span class="face"></span><span class="face"></span><span>（塗滿一個）</span></span>
  </div>

  <!-- 連線 -->
  <div class="bar"><h2>生活中的圖形</h2><span class="hint">用尺子連一連，把它們送回家</span></div>
  <div class="match">
    <div class="mcol">
      <svg width="30" height="30" viewBox="0 0 60 60"><rect x="10" y="10" width="40" height="40" rx="5" fill="#fff" stroke="#333" stroke-width="2.6"/><circle cx="22" cy="22" r="3.6" fill="#333"/><circle cx="38" cy="38" r="3.6" fill="#333"/><circle cx="30" cy="30" r="3.6" fill="#333"/></svg>
      <div class="cap">骰子</div>
    </div>
    <div class="mcol">
      <svg width="30" height="30" viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" fill="none" stroke="#333" stroke-width="6"/><circle cx="30" cy="30" r="5" fill="#333"/></svg>
      <div class="cap">車輪</div>
    </div>
    <div class="mcol">
      <svg width="30" height="30" viewBox="0 0 60 60"><polygon points="30,8 54,50 6,50" fill="#fff3d6" stroke="#333" stroke-width="2.6"/><line x1="14" y1="42" x2="46" y2="42" stroke="#333" stroke-width="2.2"/></svg>
      <div class="cap">三文治</div>
    </div>
    <div class="mcol">
      <svg width="30" height="30" viewBox="0 0 60 60"><rect x="14" y="6" width="32" height="48" fill="#e3eef7" stroke="#333" stroke-width="2.6"/><circle cx="40" cy="30" r="2.8" fill="#333"/></svg>
      <div class="cap">門</div>
    </div>
    <div class="mcol">
      <svg width="30" height="30" viewBox="0 0 60 60"><polygon points="30,6 51,18 51,42 30,54 9,42 9,18" fill="#fdeedd" stroke="#333" stroke-width="2.6"/><polygon points="30,20 39,25 39,35 30,40 21,35 21,25" fill="none" stroke="#333" stroke-width="1.8"/></svg>
      <div class="cap">蜂巢</div>
    </div>
    <div class="mcol">
      <svg width="30" height="30" viewBox="0 0 60 60"><circle cx="30" cy="30" r="23" fill="#fff" stroke="#333" stroke-width="2.4"/><polygon points="30,17 42,26 37,40 23,40 18,26" fill="#333"/></svg>
      <div class="cap">足球</div>
    </div>
  </div>
  <div class="gapzone"><span class="lbl">用尺子畫線連起來</span></div>
  <div class="match">
    <div class="mcol"><svg width="28" height="28" viewBox="0 0 40 40"><polygon points="20,5 36,32 4,32" fill="#fff3d6" stroke="#333" stroke-width="2.8"/></svg></div>
    <div class="mcol"><svg width="28" height="28" viewBox="0 0 40 40"><rect x="4" y="13" width="32" height="14" fill="#e6f7e6" stroke="#333" stroke-width="2.8"/></svg></div>
    <div class="mcol"><svg width="28" height="28" viewBox="0 0 40 40"><polygon points="36,20 28,34 12,34 4,20 12,6 28,6" fill="#fdeedd" stroke="#333" stroke-width="2.8"/></svg></div>
    <div class="mcol"><svg width="28" height="28" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#ffe6e6" stroke="#333" stroke-width="2.8"/></svg></div>
    <div class="mcol"><svg width="28" height="28" viewBox="0 0 40 40"><polygon points="20,4 35,15 29,32 11,32 5,15" fill="#f0e6fb" stroke="#333" stroke-width="2.8"/></svg></div>
    <div class="mcol"><svg width="28" height="28" viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" fill="#e2f0fb" stroke="#333" stroke-width="2.8"/></svg></div>
  </div>

  <!-- 創作 -->
  <div class="bar"><h2>我也會設計</h2><span class="hint">用六種圖形拼一幅畫，再數一數用了幾個</span></div>
  <div class="draw"><div class="tip">○ &nbsp; △ &nbsp; □ &nbsp; ▭ &nbsp; ⬠ &nbsp; ⬡</div></div>
  <div class="mcount">
    <div class="mc"><svg width="14" height="14" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#ffe6e6" stroke="#333" stroke-width="2.8"/></svg><span class="bl"></span></div>
    <div class="mc"><svg width="14" height="14" viewBox="0 0 40 40"><polygon points="20,5 36,32 4,32" fill="#fff3d6" stroke="#333" stroke-width="2.8"/></svg><span class="bl"></span></div>
    <div class="mc"><svg width="14" height="14" viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" fill="#e2f0fb" stroke="#333" stroke-width="2.8"/></svg><span class="bl"></span></div>
    <div class="mc"><svg width="14" height="14" viewBox="0 0 40 40"><rect x="4" y="13" width="32" height="14" fill="#e6f7e6" stroke="#333" stroke-width="2.8"/></svg><span class="bl"></span></div>
    <div class="mc"><svg width="14" height="14" viewBox="0 0 40 40"><polygon points="20,4 35,15 29,32 11,32 5,15" fill="#f0e6fb" stroke="#333" stroke-width="2.8"/></svg><span class="bl"></span></div>
    <div class="mc"><svg width="14" height="14" viewBox="0 0 40 40"><polygon points="36,20 28,34 12,34 4,20 12,6 28,6" fill="#fdeedd" stroke="#333" stroke-width="2.8"/></svg><span class="bl"></span></div>
  </div>

  <div class="foot"><span>平面圖形大搜查 · 一年級數學專題研習</span><span>家長簽閱：</span></div>
</div>
</body>
</html>
